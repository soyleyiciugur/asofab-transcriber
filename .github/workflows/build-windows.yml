name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download FFmpeg (real static build, not a package-manager shim)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin, build/ff | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile build/ff.zip
          Expand-Archive build/ff.zip -DestinationPath build/ff
          $src = Get-ChildItem build/ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $src.FullName build/bin/ffmpeg.exe
          Copy-Item (Join-Path $src.DirectoryName "ffprobe.exe") build/bin/ffprobe.exe
          foreach ($n in "ffmpeg", "ffprobe") {
            $f = Get-Item "build/bin/$n.exe"
            if ($f.Length -lt 5MB) { throw "$n.exe is only $($f.Length) bytes: a launcher shim, not a real binary" }
          }
          & build/bin/ffprobe.exe -version | Select-Object -First 1
          # keep PATH ffmpeg available for the test suite
          echo "$PWD/build/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install dependencies (CUDA build of PyTorch)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu121
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller asofab.spec --noconfirm

      - name: Check the bundled FFmpeg runs
        shell: pwsh
        run: |
          $d = "dist/ASOFAB-Transcriber/_internal/bin"
          foreach ($n in "ffmpeg", "ffprobe") {
            $f = Get-Item "$d/$n.exe"
            if ($f.Length -lt 5MB) { throw "bundled $n.exe is too small ($($f.Length) bytes)" }
            & "$d/$n.exe" -version | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "bundled $n.exe failed to run" }
          }

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $env:ASOFAB_PORT = "8765"
          $env:ASOFAB_NO_BROWSER = "1"
          $env:ASOFAB_HOME = "$PWD/smoke-data"
          $p = Start-Process -FilePath "dist/ASOFAB-Transcriber/ASOFAB-Transcriber.exe" -PassThru -RedirectStandardError smoke.err
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/
              if ($r.Content -match "ASOFAB TRANSCRIBER") { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content smoke.err -ErrorAction SilentlyContinue; throw "exe did not serve the UI" }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, SETUP_GOOGLE.md dist/ASOFAB-Transcriber/
          Compress-Archive -Path dist/ASOFAB-Transcriber/* -DestinationPath ASOFAB-Transcriber-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ASOFAB-Transcriber-windows
          path: ASOFAB-Transcriber-windows.zip
